<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
<div class="container">
    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <span class="fs-4">Система авторизации и ролей</span></a>
        <ul class="nav nav-pills align-items-center">
            {% if not user.is_authenticated %}
                <li class="nav-item"><a href="{% url 'users:login' %}" class="nav-link">Вход</a></li>
                <li class="nav-item"><a href="{% url 'users:register' %}" class="nav-link">Регистрация</a></li>
            {% else %}

                <li class="nav-item">
                    <span class="navbar-text me-3">Hello, {{ user }}</span>
                </li>
                <li class="nav-item"><a href="{% url 'users:edit' %}" class="nav-link">Изменить профиль</a></li>
                <li class="nav-item"><a href="{% url 'users:logout' %}" class="nav-link">Выход</a></li>
            {% endif %}
        </ul>
    </header>
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
